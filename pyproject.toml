[project]
name = "ssrename"
version = "0.1.0"
description = "Rename macOS screenshots from their contents using a local or on-device LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=4.0",
]

[project.scripts]
ssrename = "ssrename.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
